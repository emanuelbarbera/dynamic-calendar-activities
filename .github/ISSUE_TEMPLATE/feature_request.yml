name: Feature request
description: Suggest a focused improvement that preserves the lightweight design.
title: "Feature: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the need before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Explain how the feature should work from a user's perspective.
    validations:
      required: true
  - type: textarea
    id: lightweight-fit
    attributes:
      label: Lightweight and privacy fit
      description: Explain how the idea avoids or justifies new dependencies, network requests, storage, or backend services.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note any simpler workflows or designs you considered.
