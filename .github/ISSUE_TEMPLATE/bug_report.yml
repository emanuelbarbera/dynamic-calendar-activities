name: Bug report
description: Report a reproducible problem in the calendar.
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thank you for helping improve Dynamic Calendar Activities.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Explain the actual behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that demonstrates the problem.
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Firefox 130
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: Operating system
      placeholder: Windows 11
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots or a sanitized share URL only when they do not contain sensitive information.
